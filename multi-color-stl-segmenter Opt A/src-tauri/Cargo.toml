[package]
name = "stl-segmenter"
version = "0.1.0"
description = "Topology-aware STL / OBJ / 3MF segmenter for multi-colour 3D printing."
authors = ["you"]
edition = "2021"
rust-version = "1.77"

# The lib is what Tauri v2's mobile entry point + desktop main both call into.
[lib]
name = "stl_segmenter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller, faster release builds — matters for a bundled Mac .app.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
