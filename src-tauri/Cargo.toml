[package]
name = "model-splitter"
version = "0.1.0"
description = "Topology-aware STL and OBJ model splitter for multi-colour 3D printing."
authors = ["Model Splitter contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "model_splitter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
