<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Browser and native ways to run Model Splitter</title>
  <desc id="desc">After npm ci, run npm run dev for the browser or npm run tauri dev for the native macOS application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="960" height="440" rx="24" fill="url(#bg)"/>
  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Choose a run mode</text>

  <g filter="url(#shadow)">
    <rect x="340" y="72" width="280" height="86" rx="14" fill="#020617" stroke="#475569" stroke-width="2"/>
    <circle cx="365" cy="94" r="5" fill="#fb7185"/>
    <circle cx="383" cy="94" r="5" fill="#fbbf24"/>
    <circle cx="401" cy="94" r="5" fill="#4ade80"/>
    <text x="480" y="128" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="17">Model-Splitter %</text>
  </g>

  <path d="M480 158 L480 196 L236 196 L236 230" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M480 158 L480 196 L724 196 L724 230" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="235" width="332" height="160" rx="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
    <text x="236" y="271" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Browser mode</text>
    <rect x="105" y="290" width="262" height="38" rx="7" fill="#020617"/>
    <text x="236" y="315" text-anchor="middle" fill="#dbeafe" font-family="ui-monospace, monospace" font-size="15">npm run dev</text>
    <rect x="105" y="343" width="262" height="30" rx="15" fill="#1e293b"/>
    <text x="236" y="363" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="13">http://localhost:5173</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="558" y="235" width="332" height="160" rx="16" fill="#0f172a" stroke="#f97316" stroke-width="2"/>
    <text x="724" y="271" text-anchor="middle" fill="#fdba74" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Native macOS mode</text>
    <rect x="593" y="290" width="262" height="38" rx="7" fill="#020617"/>
    <text x="724" y="315" text-anchor="middle" fill="#ffedd5" font-family="ui-monospace, monospace" font-size="15">npm run tauri:dev</text>
    <rect x="593" y="343" width="262" height="30" rx="15" fill="#431407"/>
    <text x="724" y="363" text-anchor="middle" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="13">Requires Xcode tools + Rust</text>
  </g>

  <text x="480" y="422" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Press Control+C in Terminal to stop either development process.</text>
</svg>
