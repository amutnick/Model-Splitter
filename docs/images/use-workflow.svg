<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Model Splitter workflow</title>
  <desc id="desc">Open a model, inspect the preview, slice the model, and export the parts as a ZIP archive.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="960" height="330" rx="24" fill="url(#bg)"/>
  <text x="480" y="43" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">From model file to printable parts</text>

  <path d="M222 172 L277 172" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M462 172 L517 172" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M702 172 L757 172" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="37" y="85" width="185" height="174" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <path d="M87 120 h40 l14 15 v46 H87 z" fill="#0ea5e9" opacity="0.25" stroke="#7dd3fc" stroke-width="3"/>
    <path d="M127 120 v16 h14" fill="none" stroke="#7dd3fc" stroke-width="3"/>
    <text x="130" y="211" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="19" font-weight="700">1. Open</text>
    <text x="130" y="237" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">STL · OBJ · 3MF</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="277" y="85" width="185" height="174" rx="16" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <path d="M335 134 l34-19 34 19 v39 l-34 19-34-19z" fill="#a855f7" opacity="0.3" stroke="#d8b4fe" stroke-width="3"/>
    <path d="M335 134 l34 20 34-20 M369 154 v38" fill="none" stroke="#d8b4fe" stroke-width="3"/>
    <text x="370" y="211" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="19" font-weight="700">2. Preview</text>
    <text x="370" y="237" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Inspect the 3D mesh</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="517" y="85" width="185" height="174" rx="16" fill="#0f172a" stroke="#f97316" stroke-width="2"/>
    <path d="M570 145 l38-22 38 22-38 22z" fill="#0ea5e9" opacity="0.45" stroke="#7dd3fc" stroke-width="3"/>
    <path d="M572 172 l36 21 36-21" fill="none" stroke="#7dd3fc" stroke-width="3"/>
    <path d="M558 161 l100-31" stroke="#fb923c" stroke-width="6"/>
    <text x="610" y="211" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="19" font-weight="700">3. Slice</text>
    <text x="610" y="237" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Review cut planes</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="757" y="85" width="166" height="174" rx="16" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <rect x="802" y="125" width="76" height="62" rx="8" fill="#22c55e" opacity="0.25" stroke="#86efac" stroke-width="3"/>
    <path d="M818 125 v-10 h44 v10 M840 139 v31 M827 158 l13 13 13-13" fill="none" stroke="#86efac" stroke-width="3"/>
    <text x="840" y="211" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="19" font-weight="700">4. Export</text>
    <text x="840" y="237" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Download the ZIP</text>
  </g>

  <text x="480" y="300" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">All processing stays on your computer.</text>
</svg>
