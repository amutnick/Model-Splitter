<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Model Splitter installation flow</title>
  <desc id="desc">Install Node.js, open a terminal in the project folder, run npm ci, and choose browser or native mode.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="960" height="330" rx="24" fill="url(#bg)"/>
  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Install once, then choose how to run</text>

  <path d="M225 171 L278 171" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M465 171 L518 171" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M705 171 L758 171" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="38" y="86" width="187" height="170" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="72" cy="120" r="19" fill="#22c55e"/>
    <text x="72" y="127" text-anchor="middle" fill="#052e16" font-family="system-ui, sans-serif" font-size="20" font-weight="800">1</text>
    <text x="132" y="126" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Node.js</text>
    <text x="132" y="164" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Install Node.js</text>
    <text x="132" y="186" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">22.12 or newer</text>
    <rect x="64" y="210" width="137" height="27" rx="6" fill="#052e16"/>
    <text x="132" y="228" text-anchor="middle" fill="#86efac" font-family="ui-monospace, monospace" font-size="12">node --version</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="278" y="86" width="187" height="170" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="312" cy="120" r="19" fill="#38bdf8"/>
    <text x="312" y="127" text-anchor="middle" fill="#082f49" font-family="system-ui, sans-serif" font-size="20" font-weight="800">2</text>
    <text x="372" y="126" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Terminal</text>
    <text x="372" y="164" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Open Terminal in</text>
    <text x="372" y="186" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Model-Splitter</text>
    <rect x="304" y="210" width="137" height="27" rx="6" fill="#020617"/>
    <text x="372" y="228" text-anchor="middle" fill="#bae6fd" font-family="ui-monospace, monospace" font-size="12">cd Model-Splitter</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="518" y="86" width="187" height="170" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="552" cy="120" r="19" fill="#f59e0b"/>
    <text x="552" y="127" text-anchor="middle" fill="#451a03" font-family="system-ui, sans-serif" font-size="20" font-weight="800">3</text>
    <text x="612" y="126" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Install</text>
    <text x="612" y="164" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Restore exact</text>
    <text x="612" y="186" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">dependencies</text>
    <rect x="544" y="210" width="137" height="27" rx="6" fill="#451a03"/>
    <text x="612" y="228" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, monospace" font-size="12">npm ci</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="758" y="86" width="164" height="170" rx="16" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <circle cx="790" cy="120" r="19" fill="#c084fc"/>
    <text x="790" y="127" text-anchor="middle" fill="#3b0764" font-family="system-ui, sans-serif" font-size="20" font-weight="800">4</text>
    <text x="848" y="126" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Run</text>
    <text x="840" y="164" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Browser mode</text>
    <text x="840" y="186" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">or macOS app</text>
    <rect x="782" y="210" width="116" height="27" rx="6" fill="#3b0764"/>
    <text x="840" y="228" text-anchor="middle" fill="#e9d5ff" font-family="ui-monospace, monospace" font-size="12">npm run ...</text>
  </g>

  <text x="480" y="298" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Run npm ci again after pulling an update that changes package-lock.json.</text>
</svg>
