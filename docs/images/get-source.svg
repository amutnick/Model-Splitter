<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to get Model Splitter</title>
  <desc id="desc">Open the GitHub repository, select Code, then either clone with Git or download a ZIP file.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="960" height="430" rx="24" fill="url(#bg)"/>
  <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Get the Model Splitter source code</text>

  <g filter="url(#shadow)">
    <rect x="60" y="78" width="840" height="142" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
    <circle cx="88" cy="102" r="6" fill="#fb7185"/>
    <circle cx="108" cy="102" r="6" fill="#fbbf24"/>
    <circle cx="128" cy="102" r="6" fill="#4ade80"/>
    <rect x="158" y="90" width="560" height="24" rx="12" fill="#1e293b"/>
    <text x="176" y="107" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="13">github.com/amutnick/Model-Splitter</text>
    <text x="86" y="158" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="21" font-weight="700">amutnick / Model-Splitter</text>
    <rect x="744" y="136" width="126" height="42" rx="9" fill="#238636"/>
    <text x="807" y="163" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Code</text>
    <text x="86" y="194" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">Open the repository and select the green Code button.</text>
  </g>

  <path d="M480 220 L480 254 L255 254 L255 282" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M480 220 L480 254 L705 254 L705 282" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="76" y="286" width="358" height="104" rx="14" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
    <text x="255" y="320" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Option A: Clone with Git</text>
    <rect x="100" y="338" width="310" height="32" rx="7" fill="#020617"/>
    <text x="255" y="359" text-anchor="middle" fill="#dbeafe" font-family="ui-monospace, monospace" font-size="13">git clone https://github.com/...</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="526" y="286" width="358" height="104" rx="14" fill="#0f172a" stroke="#f97316" stroke-width="2"/>
    <text x="705" y="320" text-anchor="middle" fill="#fdba74" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Option B: Download ZIP</text>
    <rect x="550" y="338" width="310" height="32" rx="7" fill="#020617"/>
    <text x="705" y="359" text-anchor="middle" fill="#ffedd5" font-family="system-ui, sans-serif" font-size="13">Code → Download ZIP → Extract</text>
  </g>
</svg>
